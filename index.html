<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Click to 10</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <h1>Click to 10</h1>
      <p>Click the button 10 times to win!</p>
      <p id="score" aria-live="polite">Score: 0 / 10</p>
      <button id="click-button" type="button">Click me!</button>
      <p id="message" aria-live="polite"></p>
      <button id="reset-button" type="button">Start over</button>
    </main>
  </body>
</html>
